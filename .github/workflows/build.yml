name: Build

# Tests every push, and builds Linux and Windows installers you can download
# from the run's "Artifacts" section.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run typecheck

      - name: Backend tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installers
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: easel-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      # Windows: bundle the all-in-one setup next to the Easel installer, then
      # prove it works on a clean Windows machine.
      - name: Package the Windows setup
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $out = "easel-windows-setup"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe $out
          Copy-Item windows-setup/* $out

      - name: Lint the setup script
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $issues = Invoke-ScriptAnalyzer -Path windows-setup/Easel-Setup.ps1 -Severity Error
          $issues | Format-Table -AutoSize | Out-String | Write-Host
          if ($issues) { exit 1 }

      - name: Setup dry run and link check (Windows PowerShell 5.1)
        if: matrix.name == 'windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File easel-windows-setup/Easel-Setup.ps1 -DryRun -CheckLinks

      - name: Setup real install (no big models)
        if: matrix.name == 'windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File easel-windows-setup/Easel-Setup.ps1 -Yes -SkipModels -SkipLocalBrain -NoAutostart -NoLaunch

      - name: Check what the setup installed
        if: matrix.name == 'windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $settings = Get-Content "$env:APPDATA\app.easel.studio\settings.json" -Raw | ConvertFrom-Json
          if ($settings.comfy.url -ne "http://127.0.0.1:8188") { throw "ComfyUI address not set" }
          if (-not $settings.apps.photocraft.gui -or -not (Test-Path $settings.apps.photocraft.gui)) { throw "PhotoCraft not installed or not in settings" }
          if (-not (Get-ChildItem "$env:LOCALAPPDATA\EaselSuite\ComfyUI" -Filter run_cpu.bat -Recurse -Depth 2)) { throw "ComfyUI not unpacked" }
          if (-not ($settings.brain.order -contains "claudeCli")) { throw "Claude Code not set as a brain" }
          $easel = @("$env:LOCALAPPDATA\Easel\easel.exe", "$env:LOCALAPPDATA\Programs\Easel\easel.exe", "$env:ProgramFiles\Easel\easel.exe") | Where-Object { Test-Path $_ }
          if (-not $easel) { throw "Easel not installed" }
          $settings | ConvertTo-Json -Depth 10 | Write-Host
          Write-Host "Setup installed everything it should."

      - uses: actions/upload-artifact@v4
        if: matrix.name == 'windows'
        with:
          name: Easel-Windows-Setup
          path: easel-windows-setup
